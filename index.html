<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeTime</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <h1>LifeTime</h1>
        <p>Solo-leveling inspired personal growth system</p>
      </header>

      <main class="dashboard-grid">
        <section class="card profile-card">
          <h2>Hunter Profile</h2>
          <div class="profile-row"><span>Rank</span><strong id="rankValue">E</strong></div>
          <div class="profile-row"><span>Level</span><strong id="levelValue">1</strong></div>
          <div class="profile-row"><span>Total XP</span><strong id="totalXpValue">0</strong></div>
          <div class="xp-wrap">
            <div class="xp-label"><span>XP to next level</span><span id="xpLabel">0 / 100</span></div>
            <div class="xp-bar">
              <div id="xpProgress" class="xp-progress"></div>
            </div>
          </div>
          <p class="tip">
            Finish habits and complete daily actions to gain XP and attribute growth.
          </p>
        </section>

        <section class="card action-card">
          <h2>Daily Action Feed</h2>
          <form id="actionForm" class="action-form">
            <label>
              Action
              <select id="actionType" required>
                <option value="">Choose one...</option>
                <option value="hygiene">Morning hygiene routine (+20 XP)</option>
                <option value="gym">Gym session 45+ min (+45 XP)</option>
                <option value="steps">10,000 steps milestone (+35 XP)</option>
                <option value="reading">Focused reading 30 min (+25 XP)</option>
                <option value="nutrition">Healthy meal prep (+30 XP)</option>
                <option value="sleep">7.5+ hours sleep (+30 XP)</option>
              </select>
            </label>
            <label>
              Notes (optional)
              <input id="actionNotes" type="text" placeholder="How did it go?" maxlength="100" />
            </label>
            <button type="submit">Claim XP</button>
          </form>
          <ul id="actionLog" class="action-log"></ul>
        </section>

        <section class="card attributes-card">
          <h2>Attributes</h2>
          <div id="attributeGrid" class="attribute-grid"></div>
        </section>

        <section class="card habits-card">
          <h2>Habit Tracker</h2>
          <form id="habitForm" class="habit-form">
            <input id="habitInput" type="text" placeholder="Add daily task (e.g., Journal for 10 mins)" maxlength="80" required />
            <button type="submit">Add Habit</button>
          </form>
          <ul id="habitList" class="habit-list"></ul>
          <button id="resetDay" class="secondary">Reset Daily Checkboxes</button>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
